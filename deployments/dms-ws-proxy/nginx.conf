# Reverse proxy in front of the Discord DMs copies (CPR, Lab 3 decision): the one
# WebSocket port the contract publishes, 8086, answered by nginx and forwarded to
# whichever copy Docker's DNS hands out. Players keep connecting to
# ws://localhost:8086; the copies publish no port of their own, and the Redis
# fan-out makes every copy deliver every message, so the copy a player lands
# on does not matter.
#
#   dms-ws-proxy:
#     image: nginx:1.27-alpine
#     volumes: ["./dms-ws-proxy/nginx.conf:/etc/nginx/nginx.conf:ro"]
#     ports: ["8086:8086"]
#     depends_on: [discord-dms-service]
events {}

http {
    # Docker's embedded DNS. A short validity makes nginx re-resolve the service
    # name, so a copy started with `docker compose up -d --scale` joins the
    # rotation within seconds and a stopped one leaves it.
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8086;

        location / {
            # A variable in proxy_pass makes nginx resolve the name per request
            # instead of once at startup.
            set $upstream http://discord-dms-service:8086;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            # A WebSocket connection lives for the whole shift: never cut an idle one.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_connect_timeout 5s;
        }
    }
}
