# A test cluster of the PostgreSQL replication pattern (#164), used by failover-test.sh: one cluster of three nodes
# (ha-test-postgres-1..3), the failover agent and a client container, on a network of its own. Never part of the
# team's stack. Run from this folder: docker compose -f docker-compose.test.yml -p pgha-test up -d
name: pgha-test

x-pg-env: &pg_env
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app-password
  POSTGRES_DB: app_db
  PGHA_CLUSTER: ha-test-postgres
  PGHA_NODES: "ha-test-postgres-1 ha-test-postgres-2 ha-test-postgres-3"
  REPLICATION_PASSWORD: replication-password
  FAILOVER_PASSWORD: failover-password
  ETL_READER_PASSWORD: etl-password

x-pg-node: &pg_node
  image: ${PGHA_TEST_IMAGE:-postgres:17-alpine}
  restart: unless-stopped
  entrypoint: ["bash", "/ha/node.sh"]
  stop_grace_period: 30s
  healthcheck:
    # Healthy as a primary and as a standby (depends_on must not wait for a role); the output, kept by Docker in
    # `docker inspect`, names the role.
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app_db && psql -h 127.0.0.1 -U app -d app_db -XAtc \"select case when pg_is_in_recovery() then 'standby' else 'primary' end\""]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  ha-test-postgres-1:
    <<: *pg_node
    environment: { <<: *pg_env, PGHA_NODE: ha-test-postgres-1 }
    volumes:
      - pg1:/var/lib/postgresql/data
      - .:/ha:ro
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - state:/ha-state:ro

  ha-test-postgres-2:
    <<: *pg_node
    environment: { <<: *pg_env, PGHA_NODE: ha-test-postgres-2 }
    volumes:
      - pg2:/var/lib/postgresql/data
      - .:/ha:ro
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - state:/ha-state:ro

  ha-test-postgres-3:
    <<: *pg_node
    environment: { <<: *pg_env, PGHA_NODE: ha-test-postgres-3 }
    volumes:
      - pg3:/var/lib/postgresql/data
      - .:/ha:ro
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - state:/ha-state:ro

  pg-failover:
    image: postgres:17-alpine   # the agent's psql 17 serves PostgreSQL 16 clusters too
    restart: unless-stopped
    entrypoint: ["bash", "/ha/pg-failover.sh"]
    environment:
      PGHA_CLUSTERS: ha-test-postgres
      FAILOVER_PASSWORD: failover-password
      REPLICATION_PASSWORD: replication-password
    volumes:
      - .:/ha:ro
      - state:/ha-state

  client:
    image: ${PGHA_TEST_IMAGE:-postgres:17-alpine}
    entrypoint: ["sleep", "infinity"]
    environment:
      DSN: postgres://app:app-password@ha-test-postgres-1:5432,ha-test-postgres-2:5432,ha-test-postgres-3:5432/app_db?target_session_attrs=read-write&connect_timeout=2

volumes:
  pg1:
  pg2:
  pg3:
  state:
