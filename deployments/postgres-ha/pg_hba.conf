# Client authentication of every node of a replicated PostgreSQL cluster (#164), passed to the server with
# `-c hba_file=/ha/pg_hba.conf`, so a data directory cloned from another node or created before Lab 5 needs no edit.
# The official image's own file has the same lines except the replication one: without it no standby can stream.
#
# TYPE  DATABASE     USER        ADDRESS       METHOD
local   all          all                       trust
host    all          all         127.0.0.1/32  trust
host    all          all         ::1/128       trust
host    replication  replicator  all           scram-sha-256
host    all          all         all           scram-sha-256
