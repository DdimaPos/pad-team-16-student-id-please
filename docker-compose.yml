services:
  # Service Discovery (README "Service Discovery"): the registry every instance and the broker register with, the
  # broker routes from and Prometheus reads its targets from. One copy, registry in memory; after a restart every instance is
  # back within one heartbeat (5 s). Host port 8090 is published for the demo (the registry and /status);
  # the services and the broker reach it at http://service-discovery-service:8090 inside the network.
  # Health polling of every instance's /status every 10 s, alerts in the log and, with TELEGRAM_BOT_TOKEN
  # and TELEGRAM_CHAT_ID set in .env, in the team's Telegram group.
  service-discovery-service:
    image: d1vinexd/service-discovery-service:5.0.0
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      LOG_LEVEL: ${SERVICE_DISCOVERY_LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFY_COOLDOWN_SECONDS: ${NOTIFY_COOLDOWN_SECONDS:-300}
      # Lab 4 (4.0.0): GET /logs reads this file. It stays inside the container: never a shared volume.
      LOG_FILE: /var/log/service-discovery/service-discovery.jsonl
      # GET /api/v1/logs (the whole system's logs in one zip) also fetches the Gateway, which does not register,
      # through LOGS_STATIC_TARGETS. Its default, gateway=http://gateway-service:8080, is the Gateway of this file,
      # so it is not set here; a Gateway without GET /logs is named in the zip's manifest under "failed".
      # Prometheus (#113) reads its targets from GET /api/v1/instances/prometheus and scrapes GET /metrics.
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - student-id-net

  # Message Broker (Lab 4, README "Message Broker"): every request and event between the components. One copy.
  # gRPC on 8071 (MESSAGE_BROKER_URL=message-broker-service:8071 in the Gateway and every service), HTTP on 8070
  # (/status, /logs, /metrics, the topics and dead letter listings with the service token). Messages, subscriptions
  # and dead letters are in SQLite on the broker_data volume, so they survive a restart and a new container.
  message-broker-service:
    image: d1vinexd/message-broker-service:5.0.0
    restart: unless-stopped
    depends_on:
      service-discovery-service:
        condition: service_healthy
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Registration as message-broker, the instance list and loads it routes on, the mark-down after a breaker
      # trip and one alert per dead letter.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      LOG_LEVEL: ${MESSAGE_BROKER_LOG_LEVEL:-info}
      MESSAGE_STORE_PATH: /data/broker.db
      MESSAGE_ACK_TIMEOUT_SECONDS: ${MESSAGE_ACK_TIMEOUT_SECONDS:-5}
      # Five deliveries 5 s apart outlast the 15 s of a database failover (README "Database replication").
      MESSAGE_MAX_ATTEMPTS: ${MESSAGE_MAX_ATTEMPTS:-5}
      MESSAGE_RETENTION_HOURS: ${MESSAGE_RETENTION_HOURS:-24}
      # GET /logs reads this file. It stays inside the container: never a shared volume.
      LOG_FILE: /var/log/message-broker/message-broker.jsonl
    volumes:
      - broker_data:/data
    ports:
      - "8070:8070"
      - "8071:8071"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - student-id-net

  gateway-service:
    image: stewdh/gateway-service:5.0.0
    restart: unless-stopped
    depends_on:
      message-broker-service:
        condition: service_healthy
    environment:
      # Verifies the player JWT signed by Player Service (same value). SERVICE_TOKEN is the gRPC metadata of its
      # calls to the broker and the credential of its own GET /logs.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Above the services' 5s, so the outer layer never gives up first; x 3.5 = its breaker window on the broker.
      HTTP_REQUEST_TIMEOUT: 10s
      MAX_CONCURRENT_TASKS: "64"
      # Lab 4 (4.0.0): only the client routes (README "Gateway"), each request sent through the broker to the
      # service's requests.<prefix> queue. It no longer reads Service Discovery and does not register with it:
      # Prometheus scrapes it and Service Discovery fetches its GET /logs as static targets.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      LOG_FILE: /var/log/gateway/gateway.jsonl
      # Lab 5 (5.0.0, #167, #166; README "Caching", "Cache sharding"): the cache nodes of the consistent hashing ring.
      # The TTLs, CACHE_TIMEOUT_MS (50) and CACHE_BREAKER_WINDOW_SECONDS (10) keep their defaults, the contract's values.
      # No depends_on on the nodes on purpose: the cache fails open, so the Gateway answers through the broker while a
      # cache node is down.
      CACHE_NODES: ${CACHE_NODES:-cache-1:6379,cache-2:6379,cache-3:6379}
    ports:
      - "8080:8080"
    networks:
      - student-id-net

  # Server Rules' database (Lab 5, #164 pattern, #175): one primary and two hot standbys, failover by pg-failover
  # (deployments/postgres-ha/README.md). rules-postgres-1 starts as the primary; the service lists all three nodes
  # and connects to the writable one (Target Session Attributes=read-write). Port 5434 of node 1 is for debugging.
  rules-postgres-1:
    <<: *rules_pg_node
    environment: { <<: *rules_pg_env, PGHA_NODE: rules-postgres-1 }
    ports:
      - "5434:5432"
    volumes:
      - rules_pgdata_1:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  rules-postgres-2:
    <<: *rules_pg_node
    environment: { <<: *rules_pg_env, PGHA_NODE: rules-postgres-2 }
    volumes:
      - rules_pgdata_2:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  rules-postgres-3:
    <<: *rules_pg_node
    environment: { <<: *rules_pg_env, PGHA_NODE: rules-postgres-3 }
    volumes:
      - rules_pgdata_3:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  server-rules-service:
    image: d1vinexd/server-rules-service:5.0.1
    restart: unless-stopped
    # A lookup of a stopped database node fails within 1 s (README "Database replication", Docker Desktop for Windows).
    dns_opt: ["timeout:1", "attempts:1"]
    # Lab 3: two instances (README "Deployments"); no container_name and no host port, so more can be added with --scale.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
      rules-postgres-1:
        condition: service_healthy
    environment:
      # Lab 5 (5.0.0): the three nodes, the writable one chosen by Npgsql (README "Database replication").
      ConnectionStrings__RulesDb: "Host=rules-postgres-1,rules-postgres-2,rules-postgres-3;Port=5432;Database=${RULES_POSTGRES_DB:-rules_db};Username=${RULES_POSTGRES_USER:-rules_user};Password=${RULES_POSTGRES_PASSWORD:?set RULES_POSTGRES_PASSWORD};Target Session Attributes=read-write;Timeout=1;Host Recheck Seconds=2"
      Dev__EnableTestEndpoints: ${RULES_ENABLE_DEV_ENDPOINTS:-true}
      # Task timeout and concurrent task limit (README "Task timeout and concurrent task limit"). Dev__EnableTestEndpoints
      # mounts GET /api/v1/dev/slow?ms=, which demonstrates both. The broker checks the service token of every call;
      # the service itself checks X-Service-Token on GET /logs and, from 4.0.1, on /admin/* and /dev/* (called directly
      # only: through the broker, which never passes the token on, they are refused).
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      # Lab 3: each copy registers with Service Discovery directly (not through the Gateway) and
      # heartbeats every 5s, with the service token below.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Lab 4 (4.0.0): one gRPC subscription to the Message Broker, which delivers the requests of
      # requests.server-rules (no topic: the service consumes no event). The REST port still serves every route.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      # GET /logs reads this file. It stays inside each container: copies must never share one.
      LOG_FILE: /var/log/server-rules/server-rules.jsonl
    networks:
      - student-id-net

  # University Record's database (Lab 5, #164 pattern, #176): one primary and two hot standbys, failover by
  # pg-failover (deployments/postgres-ha/README.md). university-record-postgres-1 starts as the primary; the service
  # lists all three nodes and connects to the writable one (Target Session Attributes=read-write). Port 5435 of node 1
  # is for debugging.
  university-record-postgres-1:
    <<: *university_record_pg_node
    environment: { <<: *university_record_pg_env, PGHA_NODE: university-record-postgres-1 }
    ports:
      - "5435:5432"
    volumes:
      - university_record_pgdata_1:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  university-record-postgres-2:
    <<: *university_record_pg_node
    environment: { <<: *university_record_pg_env, PGHA_NODE: university-record-postgres-2 }
    volumes:
      - university_record_pgdata_2:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  university-record-postgres-3:
    <<: *university_record_pg_node
    environment: { <<: *university_record_pg_env, PGHA_NODE: university-record-postgres-3 }
    volumes:
      - university_record_pgdata_3:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  university-record-service:
    image: d1vinexd/university-record-service:5.0.1
    restart: unless-stopped
    # A lookup of a stopped database node fails within 1 s (README "Database replication", Docker Desktop for Windows).
    dns_opt: ["timeout:1", "attempts:1"]
    # Lab 3: two instances (README "Deployments"); no container_name and no host port, so more can be added with --scale.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
      university-record-postgres-1:
        condition: service_healthy
    environment:
      # Lab 5 (5.0.0): the three nodes, the writable one chosen by Npgsql (README "Database replication").
      ConnectionStrings__UniversityRecordDb: "Host=university-record-postgres-1,university-record-postgres-2,university-record-postgres-3;Port=5432;Database=${UNIVERSITY_RECORD_POSTGRES_DB:-university_record_db};Username=${UNIVERSITY_RECORD_POSTGRES_USER:-university_record_user};Password=${UNIVERSITY_RECORD_POSTGRES_PASSWORD:?set UNIVERSITY_RECORD_POSTGRES_PASSWORD};Target Session Attributes=read-write;Timeout=1;Host Recheck Seconds=2"
      REFERENCE_YEAR: *reference_year
      # The gRPC metadata x-service-token of every broker call and X-Service-Token to Service Discovery; incoming, it is
      # checked on GET /logs and, from 4.0.1, on /admin/* and /dev/* (called directly only, never through the broker).
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Lab 4 (4.0.0): one gRPC subscription to the Message Broker, which delivers applicant.initialized and
      # session.ended (topics events.<event_type>) and the requests of requests.university-record; from 5.0.0 these
      # include the saga step grant-scopes of shift.start, which brings the juniors' scopes (session.started is no
      # longer consumed). Its own applicant.initialized is published once to events.applicant.initialized.
      # POST /api/v1/events, APPLICANT_URL and CREDENTIAL_URL are gone. While the broker is unreachable the instance retries the subscription
      # with backoff (broker.subscribe_failed), its events wait in the outbox, and it keeps serving /health and /status.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      # GET /logs reads this file. It stays inside each container: copies must never share one.
      LOG_FILE: /var/log/university-record/university-record.jsonl
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      # Lab 3: each copy registers with Service Discovery directly (not through the Gateway) and
      # heartbeats every 5s, with the service token above.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      Dev__EnableTestEndpoints: ${UNIVERSITY_RECORD_ENABLE_DEV_ENDPOINTS:-true}
    networks:
      - student-id-net

  # Moderation's database (Lab 5, #164 pattern, #177): one primary and two hot standbys, failover by pg-failover
  # (deployments/postgres-ha/README.md). moderation-postgres-1 starts as the primary; the service lists all three
  # nodes and connects to the writable one (target_session_attrs=read-write). Port 5436 of node 1 is for debugging.
  moderation-postgres-1:
    <<: *moderation_pg_node
    environment: { <<: *moderation_pg_env, PGHA_NODE: moderation-postgres-1 }
    ports:
      - "5436:5432"
    volumes:
      - moderation_pgdata_1:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  moderation-postgres-2:
    <<: *moderation_pg_node
    environment: { <<: *moderation_pg_env, PGHA_NODE: moderation-postgres-2 }
    volumes:
      - moderation_pgdata_2:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  moderation-postgres-3:
    <<: *moderation_pg_node
    environment: { <<: *moderation_pg_env, PGHA_NODE: moderation-postgres-3 }
    volumes:
      - moderation_pgdata_3:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  moderation-service:
    image: dmracovit/moderation-service:5.0.0
    restart: unless-stopped
    # A lookup of a stopped database node fails within 1 s (README "Database replication", Docker Desktop for Windows).
    dns_opt: ["timeout:1", "attempts:1"]
    # Two instances (README "Deployments"); no container_name and no host port, so more can be added with --scale.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
      moderation-postgres-1:
        condition: service_healthy
    environment:
      # Service Discovery (README "Service Discovery"): every instance registers its address under `moderation`,
      # heartbeats every 5 s and deregisters on shutdown. The `:-` default applies even to an empty value in .env;
      # registration is off only when the container's own environment has an empty SERVICE_DISCOVERY_URL.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      DATABASE_URL: "postgres://${MODERATION_POSTGRES_USER:-moderation_user}:${MODERATION_POSTGRES_PASSWORD:?set MODERATION_POSTGRES_PASSWORD}@moderation-postgres-1:5432,moderation-postgres-2:5432,moderation-postgres-3:5432/${MODERATION_POSTGRES_DB:-moderation_db}?sslmode=disable&target_session_attrs=read-write&connect_timeout=1"
      # The stack's one X-Service-Token: the metadata of every call to the broker; checked here on /logs, /admin and /dev.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      DEV_ENDPOINTS: ${MODERATION_DEV_ENDPOINTS:-true}
      SEED_ON_START: "true"
      REFERENCE_YEAR: *reference_year
      # Lab 4 (README "Message Broker"): the five peers are called as requests through the broker (requests.session,
      # requests.applicant, ...), decision.recorded is published to events.decision.recorded, and the service's own
      # requests arrive from requests.moderation. The same variable and default as the Gateway and every service.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
    networks:
      - student-id-net

  # Discord DMs' database (Lab 5, #164 pattern, #178): the replica set rs0 of three members, failover by MongoDB's own
  # election (deployments/mongo-rs/README.md). Only dms-mongo-1 gets the root user; dms-mongo-init initiates the set
  # once and creates etl_reader. The service lists the three members and names the set (replicaSet=rs0). Port 27019
  # of dms-mongo-1 is for debugging only (directConnection=true).
  dms-mongo-1:
    <<: *dms_mongo_member
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
      MONGO_INITDB_ROOT_USERNAME: ${DMS_MONGO_USER:-dms_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DMS_MONGO_PASSWORD:?set DMS_MONGO_PASSWORD}
    ports:
      - "27019:27017"
    volumes:
      - dms_mongodata_1:/data/db
      - ./deployments/mongo-rs:/rs:ro

  dms-mongo-2:
    <<: *dms_mongo_member
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
    volumes:
      - dms_mongodata_2:/data/db
      - ./deployments/mongo-rs:/rs:ro

  dms-mongo-3:
    <<: *dms_mongo_member
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
    volumes:
      - dms_mongodata_3:/data/db
      - ./deployments/mongo-rs:/rs:ro

  dms-mongo-init:
    image: mongo:7
    restart: "no"
    entrypoint: ["bash", "/rs/init.sh"]
    environment:
      MONGO_RS_MEMBERS: "dms-mongo-1 dms-mongo-2 dms-mongo-3"
      MONGO_ROOT_USER: ${DMS_MONGO_USER:-dms_user}
      MONGO_ROOT_PASSWORD: ${DMS_MONGO_PASSWORD:?set DMS_MONGO_PASSWORD}
      MONGO_APP_DB: dms_db
      ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}
    volumes:
      - ./deployments/mongo-rs:/rs:ro
    depends_on:
      dms-mongo-1:
        condition: service_healthy
      dms-mongo-2:
        condition: service_healthy
      dms-mongo-3:
        condition: service_healthy
    networks:
      - student-id-net

  dms-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - student-id-net

  discord-dms-service:
    image: dmracovit/discord-dms-service:5.0.0
    restart: unless-stopped
    # A lookup of a stopped replica set member fails within 1 s (README "Database replication", Docker Desktop for Windows).
    dns_opt: ["timeout:1", "attempts:1"]
    # Two copies, none publishing a port. The one chat port of the stack, 8086, is answered by dms-ws-proxy
    # below, which hands each WebSocket connection to one of the copies; the Redis fan-out makes every copy deliver
    # every message, so the copy does not matter. More copies: --scale discord-dms-service=3.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
      dms-mongo-init:
        condition: service_completed_successfully
      dms-redis:
        condition: service_healthy
    environment:
      MONGODB_URI: "mongodb://${DMS_MONGO_USER:-dms_user}:${DMS_MONGO_PASSWORD:?set DMS_MONGO_PASSWORD}@dms-mongo-1:27017,dms-mongo-2:27017,dms-mongo-3:27017/dms_db?authSource=admin&replicaSet=rs0&retryWrites=true"
      # Required with several copies: a message stored by one copy reaches the players connected to the others.
      REDIS_URL: redis://dms-redis:6379/0
      # /api/v1/dev/* with X-Service-Token; from 5.0.0 also the failure switch of the demo,
      # POST /api/v1/dev/saga-steps/fail-next (the next create-channels answers 500 once, so the saga compensates).
      DEV_ENDPOINTS: ${DMS_DEV_ENDPOINTS:-true}
      SEED_ON_START: "true"
      # The address clients reach port 8086 at: the base of the ws_url a ticket comes with. The chat is
      # negotiated through the Gateway (POST /api/v1/discord-dms/ws-tickets) and connected to the proxy directly.
      WS_PUBLIC_URL: ${DMS_WS_PUBLIC_URL:-ws://localhost:8086}
      # Two listeners: 8086 serves the WebSocket only (reached through dms-ws-proxy); the REST API listens on 8096,
      # never published, which is what every copy registers with Service Discovery and where it and Prometheus poll it.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      # The stack's one X-Service-Token: the metadata of the broker stream; checked here on /logs, /admin and /dev.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Lab 4 (README "Message Broker"): every copy's stream brings the Gateway's requests (requests.discord-dms) and
      # the events of events.session.ended. Lab 5 (5.0.0): session.started is retired; the session's channels are
      # created by the saga step create-channels of shift.start, which the broker's coordinator sends on
      # requests.discord-dms (POST /api/v1/saga-steps/create-channels and .../compensate). The chat path is unchanged.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
    networks:
      - student-id-net

  dms-ws-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - discord-dms-service
    volumes:
      - ./deployments/dms-ws-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8086:8086"   # the one chat port of the stack: ws://localhost:8086/api/v1/ws?ticket=... reaches one of the copies
    networks:
      - student-id-net

  player-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-player_user}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:?set PLAYER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-player_db}
    volumes:
      - player_pgdata:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_POSTGRES_USER:-player_user} -d ${PLAYER_POSTGRES_DB:-player_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  player-service:
    image: dimapos/player-service:5.0.0
    restart: unless-stopped
    # Lab 3: two instances (README "Deployments"); no container_name and no host port, so more can be added with --scale.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      player-postgres:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
    environment:
      APP_ENV: docker
      # Signs the player JWT issued by POST /api/v1/auth/login. The Gateway
      # verifies it with the same value.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      HTTP_REQUEST_TIMEOUT: ${PLAYER_HTTP_REQUEST_TIMEOUT:-5s}
      MAX_CONCURRENT_TASKS: ${PLAYER_MAX_CONCURRENT_TASKS:-50}
      # Lab 5 (5.0.0): POSTGRES_HOST takes the primary and its standbys as a comma list
      # (player-postgres-1,player-postgres-2,player-postgres-3, with target_session_attrs=read-write);
      # the block moves to player-postgres-1..3 once the replication pattern (#164) is merged.
      POSTGRES_HOST: player-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-player_user}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:?set PLAYER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-player_db}
      # Seeds six players on an empty database, including the one the README's
      # own example response describes (level 4, 1250 xp).
      SEED_ON_START: ${PLAYER_SEED_ON_START:-true}
      # Mounts GET /api/v1/dev/slow?ms=, which demonstrates the 408 and the 429.
      ENABLE_DEV_ENDPOINTS: ${PLAYER_ENABLE_DEV_ENDPOINTS:-true}
      # Lab 3: registration with Service Discovery, directly (not through the Gateway). The URL
      # defaults to the internal container address, so an empty value in .env still registers;
      # SERVICE_TOKEN is required with it.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Lab 4 (4.0.0): one gRPC subscription to the Message Broker, which delivers session.ended
      # (topic events.session.ended) and the requests of requests.player. POST /api/v1/events is
      # gone.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      # GET /logs reads this file. It stays inside each container: copies must never share one.
      LOG_FILE: /var/log/player/player.jsonl
    networks:
      - student-id-net

  session-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SESSION_POSTGRES_USER:-session_user}
      POSTGRES_PASSWORD: ${SESSION_POSTGRES_PASSWORD:?set SESSION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SESSION_POSTGRES_DB:-session_db}
    volumes:
      - session_pgdata:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESSION_POSTGRES_USER:-session_user} -d ${SESSION_POSTGRES_DB:-session_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  session-service:
    image: dimapos/server-moderation-session-service:5.0.1
    restart: unless-stopped
    # Lab 3: two instances (README "Deployments"); no container_name and no host port, so more can be added with --scale.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
      session-postgres:
        condition: service_healthy
    environment:
      APP_ENV: docker
      # Lab 5 (5.0.0): POSTGRES_HOST takes the primary and its standbys as a comma list
      # (session-postgres-1,session-postgres-2,session-postgres-3, with target_session_attrs=read-write);
      # the block moves to session-postgres-1..3 once the replication pattern (#164) is merged.
      POSTGRES_HOST: session-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${SESSION_POSTGRES_USER:-session_user}
      POSTGRES_PASSWORD: ${SESSION_POSTGRES_PASSWORD:?set SESSION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SESSION_POSTGRES_DB:-session_db}
      # Lab 4 (4.0.0): one gRPC connection to the Message Broker carries the calls to Player,
      # Server Rules and Applicant (requests.<service>), the publishes of session.ended, and the
      # subscription that delivers decision.recorded and the requests of requests.session. From 5.0.1
      # also StartSaga (the saga shift.start of POST /start, whose steps come back on
      # requests.session); session.started is retired. It replaces the five *_SERVICE_URL of Lab 3; POST /api/v1/events is gone.
      # The same variable and default as the Gateway and every service; empty selects the built-in
      # stubs. GET /health/ready says what is wired.
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # GET /logs reads this file. It stays inside each container: copies must never share one.
      LOG_FILE: /var/log/session/session.jsonl
      HTTP_REQUEST_TIMEOUT: ${SESSION_HTTP_REQUEST_TIMEOUT:-5s}
      MAX_CONCURRENT_TASKS: ${SESSION_MAX_CONCURRENT_TASKS:-50}
      # Seeds three sessions on an empty database - one in each state - so every
      # endpoint answers on the first request.
      SEED_ON_START: ${SESSION_SEED_ON_START:-true}
      # Mounts GET /api/v1/dev/slow?ms=, which demonstrates the 408 and the 429.
      ENABLE_DEV_ENDPOINTS: ${SESSION_ENABLE_DEV_ENDPOINTS:-true}
      # Lab 3: registration with Service Discovery, directly (not through the Gateway), with the
      # SERVICE_TOKEN above. Defaults to the internal container address, so an empty value in
      # .env still registers.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
    networks:
      - student-id-net

  # Applicant's database (Lab 5, #164 pattern, #173): one primary and two hot standbys, failover by pg-failover
  # (deployments/postgres-ha/README.md). applicant-postgres-1 starts as the primary; the service lists all three
  # nodes and connects to the writable one (target_session_attrs=read-write). Port 5433 of node 1 is for debugging:
  # after a failover it may reach a standby.
  applicant-postgres-1:
    <<: *applicant_pg_node
    environment: { <<: *applicant_pg_env, PGHA_NODE: applicant-postgres-1 }
    ports:
      - "5433:5432"
    volumes:
      - applicant_pgdata_1:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  applicant-postgres-2:
    <<: *applicant_pg_node
    environment: { <<: *applicant_pg_env, PGHA_NODE: applicant-postgres-2 }
    volumes:
      - applicant_pgdata_2:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  applicant-postgres-3:
    <<: *applicant_pg_node
    environment: { <<: *applicant_pg_env, PGHA_NODE: applicant-postgres-3 }
    volumes:
      - applicant_pgdata_3:/var/lib/postgresql/data
      - ./deployments/postgres-ha:/ha:ro
      - ./deployments/postgres-ha/initdb.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - pg_ha_state:/ha-state:ro

  applicant-service:
    image: stewdh/applicant-service:5.0.0
    restart: unless-stopped
    # A lookup of a stopped database node fails within 1 s (README "Database replication", Docker Desktop for Windows).
    dns_opt: ["timeout:1", "attempts:1"]
    # Two copies share the database (no container_name, no host port);
    # `docker compose up -d --scale applicant-service=3` adds a third.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      applicant-postgres-1:
        condition: service_healthy
      message-broker-service:
        condition: service_healthy
    environment:
      APP_ENV: docker
      APP_PORT: "8081"
      LOG_LEVEL: info
      SERVICE_VERSION: "5.0.0"
      TZ: UTC
      # Task timeout (408) and concurrent task limit (429) - README "Task timeout and concurrent
      # task limit". DEV_ENDPOINTS mounts GET /api/v1/dev/slow?ms=, which demonstrates both.
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      DEV_ENDPOINTS: ${APPLICANT_DEV_ENDPOINTS:-true}
      # The three nodes; the driver keeps the one that accepts writes (README "Database replication").
      DATABASE_URL: "postgres://${APPLICANT_POSTGRES_USER:-applicant_user}:${APPLICANT_POSTGRES_PASSWORD:?set APPLICANT_POSTGRES_PASSWORD}@applicant-postgres-1:5432,applicant-postgres-2:5432,applicant-postgres-3:5432/${APPLICANT_POSTGRES_DB:-applicant_db}?sslmode=disable&target_session_attrs=read-write&connect_timeout=1"
      MIGRATE_ON_START: "true"
      # Lab 4 (README "Event delivery"): requests arrive on the broker's requests.applicant
      # queue and applicant.initialized is published to events.applicant.initialized, over
      # gRPC, with the one service token as metadata. The broker's address, never a peer's.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      # Each copy registers itself here directly (not through the Gateway) as
      # applicant-<container id>, with the same service token, and heartbeats every 5s.
      SERVICE_DISCOVERY_URL: http://service-discovery-service:8090
      REFERENCE_YEAR: *reference_year
    healthcheck:
      test: ["CMD", "/applicantd", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - student-id-net

  # Credential's database (Lab 5, #164 pattern, #174): the replica set rs0 of three members, failover by MongoDB's own
  # election (deployments/mongo-rs/README.md). Only credential-mongo-1 gets the root user; credential-mongo-init
  # initiates the set once and creates etl_reader. The service lists the three members and names the set
  # (replicaSet=rs0). Port 27018 of credential-mongo-1 is for debugging only (directConnection=true).
  credential-mongo-1:
    <<: *credential_mongo_member
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
      MONGO_INITDB_ROOT_USERNAME: ${CREDENTIAL_MONGO_USER:-credential_user}
      MONGO_INITDB_ROOT_PASSWORD: ${CREDENTIAL_MONGO_PASSWORD:?set CREDENTIAL_MONGO_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - credential_mongodata_1:/data/db
      - ./deployments/mongo-rs:/rs:ro

  credential-mongo-2:
    <<: *credential_mongo_member
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
    volumes:
      - credential_mongodata_2:/data/db
      - ./deployments/mongo-rs:/rs:ro

  credential-mongo-3:
    <<: *credential_mongo_member
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?set MONGO_REPLICA_KEY}
    volumes:
      - credential_mongodata_3:/data/db
      - ./deployments/mongo-rs:/rs:ro

  credential-mongo-init:
    image: mongo:7
    restart: "no"
    entrypoint: ["bash", "/rs/init.sh"]
    environment:
      MONGO_RS_MEMBERS: "credential-mongo-1 credential-mongo-2 credential-mongo-3"
      MONGO_ROOT_USER: ${CREDENTIAL_MONGO_USER:-credential_user}
      MONGO_ROOT_PASSWORD: ${CREDENTIAL_MONGO_PASSWORD:?set CREDENTIAL_MONGO_PASSWORD}
      MONGO_APP_DB: credential_db
      ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}
    volumes:
      - ./deployments/mongo-rs:/rs:ro
    depends_on:
      credential-mongo-1:
        condition: service_healthy
      credential-mongo-2:
        condition: service_healthy
      credential-mongo-3:
        condition: service_healthy
    networks:
      - student-id-net

  credential-service:
    image: stewdh/credential-service:5.0.0
    restart: unless-stopped
    # A lookup of a stopped replica set member fails within 1 s (README "Database replication", Docker Desktop for Windows).
    dns_opt: ["timeout:1", "attempts:1"]
    # Two copies share the replica set (no container_name, no host port);
    # `docker compose up -d --scale credential-service=3` adds a third.
    deploy:
      replicas: 2
    depends_on:
      service-discovery-service:
        condition: service_healthy
      credential-mongo-init:
        condition: service_completed_successfully
      message-broker-service:
        condition: service_healthy
    environment:
      APP_ENV: docker
      APP_PORT: "8082"
      LOG_LEVEL: info
      SERVICE_VERSION: "5.0.0"
      TZ: UTC
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      DEV_ENDPOINTS: ${CREDENTIAL_DEV_ENDPOINTS:-true}
      # The three members; the driver finds the primary and retries a write once after an election (README
      # "Database replication").
      MONGODB_URI: "mongodb://${CREDENTIAL_MONGO_USER:-credential_user}:${CREDENTIAL_MONGO_PASSWORD:?set CREDENTIAL_MONGO_PASSWORD}@credential-mongo-1:27017,credential-mongo-2:27017,credential-mongo-3:27017/credential_db?replicaSet=rs0&authSource=admin"
      MONGODB_DATABASE: credential_db
      ENSURE_INDEXES_ON_START: "true"
      # Lab 4: requests on requests.credential and events.applicant.initialized through the
      # broker, as for Applicant above.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-message-broker-service:8071}
      # Each copy registers itself here directly (not through the Gateway) as
      # credential-<container id>, with the same service token, and heartbeats every 5s.
      SERVICE_DISCOVERY_URL: http://service-discovery-service:8090
      REFERENCE_YEAR: *reference_year
    healthcheck:
      test: ["CMD", "/credentiald", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - student-id-net

  # Cache nodes of the Gateway (Lab 5, #166, #167, #170; README "Caching", "Cache sharding"): three Valkey nodes (the
  # open fork of Redis 7.2, same protocol and clients), no persistence - a cache, so losing a node loses nothing -, 64 MB
  # each with LRU eviction. The Gateway places every key on one node by a consistent hashing ring over CACHE_NODES
  # (cache-1:6379,cache-2:6379,cache-3:6379). Not published on the host: only the Gateway talks to them.
  cache-1:
    <<: *cache_node

  cache-2:
    <<: *cache_node

  cache-3:
    <<: *cache_node

  # Data warehouse (Lab 5, #165; README "Data warehouse and ETL"): warehouse_db, the star schema the ETL Service loads.
  # One node, not replicated: the ETL can rebuild it from the services. The ETL creates the schema with its own
  # versioned migrations, as the user `warehouse`. The init script of deployments/warehouse/ creates grafana_reader,
  # the read-only role of Grafana's "Analytics" dashboard; like every init script it runs only on an empty volume.
  # Host port 5440 is published for the demo and the developers.
  warehouse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD}
      POSTGRES_DB: warehouse_db
      WAREHOUSE_GRAFANA_PASSWORD: ${WAREHOUSE_GRAFANA_PASSWORD:?set WAREHOUSE_GRAFANA_PASSWORD}
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
      - ./deployments/warehouse/init-grafana-reader.sh:/docker-entrypoint-initdb.d/10-grafana-reader.sh:ro
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  # ETL Service (Lab 5, #165; README "Data warehouse and ETL", docs/ETL_SERVICE.md): a run right after startup, then
  # every ETL_INTERVAL_SECONDS and on POST /api/v1/runs (X-Service-Token, called directly inside the network, never
  # through the Gateway or the broker). It reads every service database read-only as etl_reader and writes only to
  # warehouse_db. One copy (two copies would still never run at once: the run lock is an advisory lock in
  # warehouse_db). Host port 8075 is published for the demo. It registers with Service Discovery as `etl`, so
  # Prometheus scrapes it and the logs download fetches its GET /logs.
  etl-service:
    image: d1vinexd/etl-service:5.0.1
    restart: unless-stopped
    # A lookup of a stopped database node fails within 1 s, not after Docker Desktop for Windows' 5 to 16 s (#197).
    dns_opt: ["timeout:1", "attempts:1"]
    depends_on:
      service-discovery-service:
        condition: service_healthy
      warehouse-postgres:
        condition: service_healthy
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery-service:8090}
      LOG_LEVEL: ${ETL_LOG_LEVEL:-info}
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-60}
      # GET /logs reads this file. It stays inside the container: never a shared volume.
      LOG_FILE: /var/log/etl/etl.jsonl
      WAREHOUSE_DSN: "postgresql://warehouse:${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD}@warehouse-postgres:5432/warehouse_db?sslmode=disable"
      # The eight sources, as the read-only role etl_reader (ETL_READER_PASSWORD; letters, digits and - _ . ~ only,
      # since it goes into a URL). The ETL appends target_session_attrs=prefer-standby and
      # readPreference=secondaryPreferred itself. Server Rules, University Record, Moderation and Applicant run
      # three-node PostgreSQL clusters and Credential and Discord DMs three-member replica sets (<db>-1, <db>-2, <db>-3),
      # so their DSN or URI lists the three; Player and Session run one PostgreSQL container each, so their DSN names it. A
      # database gets a login-capable etl_reader from the replication pattern's init script (deployments/postgres-ha,
      # deployments/mongo-rs); a source whose database has none fails every run and is named in the run's
      # failed_sources, the others still load (docs/ETL_SERVICE.md "Known gap"). ETL_SOURCE_CONNECT_TIMEOUT_SECONDS
      # keeps the image default of 1 s.
      PLAYER_DB_DSN: "postgresql://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@player-postgres:5432/${PLAYER_POSTGRES_DB:-player_db}?sslmode=disable"
      SESSION_DB_DSN: "postgresql://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@session-postgres:5432/${SESSION_POSTGRES_DB:-session_db}?sslmode=disable"
      APPLICANT_DB_DSN: "postgresql://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@applicant-postgres-1:5432,applicant-postgres-2:5432,applicant-postgres-3:5432/${APPLICANT_POSTGRES_DB:-applicant_db}?sslmode=disable"
      CREDENTIAL_MONGO_URI: "mongodb://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@credential-mongo-1:27017,credential-mongo-2:27017,credential-mongo-3:27017/credential_db?authSource=admin&replicaSet=rs0"
      RULES_DB_DSN: "postgresql://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@rules-postgres-1:5432,rules-postgres-2:5432,rules-postgres-3:5432/${RULES_POSTGRES_DB:-rules_db}?sslmode=disable"
      UNIVERSITY_RECORD_DB_DSN: "postgresql://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@university-record-postgres-1:5432,university-record-postgres-2:5432,university-record-postgres-3:5432/${UNIVERSITY_RECORD_POSTGRES_DB:-university_record_db}?sslmode=disable"
      MODERATION_DB_DSN: "postgresql://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@moderation-postgres-1:5432,moderation-postgres-2:5432,moderation-postgres-3:5432/${MODERATION_POSTGRES_DB:-moderation_db}?sslmode=disable"
      DMS_MONGO_URI: "mongodb://etl_reader:${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}@dms-mongo-1:27017,dms-mongo-2:27017,dms-mongo-3:27017/dms_db?authSource=admin&replicaSet=rs0"
    ports:
      - "8075:8075"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8075/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - student-id-net

  # Failover agent of the replicated PostgreSQL databases (Lab 5, #164; deployments/postgres-ha/README.md). One
  # container for every cluster listed in PGHA_CLUSTERS (the nodes of cluster C are C-1, C-2 and C-3), one loop each:
  # 6 s without an answer from a primary, it promotes the most advanced standby and re-points the other one; it keeps
  # synchronous replication on while a standby streams, and fences an old primary that wakes up. The leader of each
  # cluster lives in the pg_ha_state volume, which every node reads before it starts. Each owner adds their cluster to
  # PGHA_CLUSTERS when they convert their database (#171 to #178); until then the agent idles. No port.
  pg-failover:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["bash", "/ha/pg-failover.sh"]
    environment:
      PGHA_CLUSTERS: "moderation-postgres rules-postgres applicant-postgres university-record-postgres"
      FAILOVER_PASSWORD: ${FAILOVER_PASSWORD:-}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-}
    volumes:
      - ./deployments/postgres-ha:/ha:ro
      - pg_ha_state:/ha-state
    networks:
      - student-id-net
    # A check of a stopped node fails within 1 s instead of using its whole 3 s bound on a DNS lookup (#197).
    dns_opt: ["timeout:1", "attempts:1"]

  # Monitoring (Lab 4, #113; README "Deployments", "Monitoring stack"). Prometheus reads the scrape targets from
  # Service Discovery (every up instance and the broker) plus the Gateway and Service Discovery as static targets,
  # and scrapes their GET /metrics every 5 s. Alloy reads every container's stdout (the JSON log lines) through
  # the Docker API and ships it to Loki. Grafana shows both: the dashboards "System" and "Broker" are provisioned
  # from monitoring/grafana, and from Lab 5 (#165) "Analytics", which reads warehouse_db as grafana_reader.
  # Configuration lives in monitoring/.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      service-discovery-service:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    configs:
      # The token of GET /api/v1/instances/prometheus, read from a file so it stays out of prometheus.yml.
      - source: prometheus_service_token
        target: /etc/prometheus/service_token
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - student-id-net

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks:
      - student-id-net

  # The Docker socket is mounted read-only, only to list this project's containers and read their logs.
  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    depends_on:
      - loki
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - student-id-net

  grafana:
    image: grafana/grafana:12.4.14
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Lab 5 (#165): the password of grafana_reader, the read-only role of the "Warehouse" datasource; Grafana
      # expands ${WAREHOUSE_GRAFANA_PASSWORD} in monitoring/grafana/provisioning/datasources/datasources.yml.
      WAREHOUSE_GRAFANA_PASSWORD: ${WAREHOUSE_GRAFANA_PASSWORD:?set WAREHOUSE_GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - student-id-net

configs:
  prometheus_service_token:
    content: ${SERVICE_TOKEN:?set SERVICE_TOKEN}

networks:
  student-id-net:
    external: true
    name: student-id-net

volumes:
  rules_pgdata_1:
  rules_pgdata_2:
  rules_pgdata_3:
  university_record_pgdata_1:
  university_record_pgdata_2:
  university_record_pgdata_3:
  moderation_pgdata_1:
  moderation_pgdata_2:
  moderation_pgdata_3:
  dms_mongodata_1:
  dms_mongodata_2:
  dms_mongodata_3:
  player_pgdata:
  session_pgdata:
  applicant_pgdata_1:
  applicant_pgdata_2:
  applicant_pgdata_3:
  credential_mongodata_1:
  credential_mongodata_2:
  credential_mongodata_3:
  pg_ha_state:
  broker_data:
  warehouse_pgdata:
  prometheus_data:
  loki_data:
  grafana_data:
