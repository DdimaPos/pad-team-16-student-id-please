# Team-wide compose - references PUBLISHED Docker Hub images only, never `build:`. Any
# teammate can run this without cloning anyone's (private) service repository. So far it
# covers Server Rules, University Record, Moderation, Discord DMs, Player, Server
# Moderation Session, Applicant and Credential. There is no message broker: services call
# each other and push events over HTTP through the Gateway (README "Event delivery"); the
# Lab 1 images still call each other directly until their Lab 2 images land. Applicant,
# Credential and Moderation reach their peers through the Gateway (`gateway-service`), which
# this file does not run yet; until its block lands, their events wait in their outboxes and
# each service's /health/ready shows the backlog per consumer. Other services should add
# their own blocks here the same way, referencing their own published image and joining the
# same `student-id-net` network.
#
# Every service token below is the same value, SERVICE_TOKEN in .env - the contract's one
# X-Service-Token for the whole stack.
#
# Host ports are allocated in the Deployments table of README.md - check it and take the
# next free number before adding a block, so two services never claim the same port.
#
# Usage:
#   docker network create student-id-net   # once, if it does not already exist
#   docker compose up -d
name: student-id-please

x-reference-year: &reference_year "2026"

services:
  rules-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RULES_POSTGRES_USER:-rules_user}
      POSTGRES_PASSWORD: ${RULES_POSTGRES_PASSWORD:?set RULES_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RULES_POSTGRES_DB:-rules_db}
    volumes:
      - rules_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RULES_POSTGRES_USER:-rules_user} -d ${RULES_POSTGRES_DB:-rules_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  server-rules-service:
    image: d1vinexd/server-rules-service:2.1.0
    restart: unless-stopped
    depends_on:
      rules-postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__RulesDb: "Host=rules-postgres;Port=5432;Database=${RULES_POSTGRES_DB:-rules_db};Username=${RULES_POSTGRES_USER:-rules_user};Password=${RULES_POSTGRES_PASSWORD:?set RULES_POSTGRES_PASSWORD}"
      Dev__EnableTestEndpoints: ${RULES_ENABLE_DEV_ENDPOINTS:-true}
      # Task timeout and concurrent task limit (README "Task timeout and concurrent task limit"). Dev__EnableTestEndpoints
      # mounts GET /api/v1/dev/slow?ms=, which demonstrates both. The service checks no token: the Gateway does.
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
    ports:
      - "8083:8080"
    networks:
      - student-id-net

  university-record-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UNIVERSITY_RECORD_POSTGRES_USER:-university_record_user}
      POSTGRES_PASSWORD: ${UNIVERSITY_RECORD_POSTGRES_PASSWORD:?set UNIVERSITY_RECORD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${UNIVERSITY_RECORD_POSTGRES_DB:-university_record_db}
    volumes:
      - university_record_pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNIVERSITY_RECORD_POSTGRES_USER:-university_record_user} -d ${UNIVERSITY_RECORD_POSTGRES_DB:-university_record_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  university-record-service:
    image: d1vinexd/university-record-service:2.1.1
    restart: unless-stopped
    depends_on:
      university-record-postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__UniversityRecordDb: "Host=university-record-postgres;Port=5432;Database=${UNIVERSITY_RECORD_POSTGRES_DB:-university_record_db};Username=${UNIVERSITY_RECORD_POSTGRES_USER:-university_record_user};Password=${UNIVERSITY_RECORD_POSTGRES_PASSWORD:?set UNIVERSITY_RECORD_POSTGRES_PASSWORD}"
      REFERENCE_YEAR: *reference_year
      # The service checks no incoming token; SERVICE_TOKEN is what it sends with its own events.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Consumers of applicant.initialized: the Gateway plus the consumer's prefix.
      APPLICANT_URL: ${UNIVERSITY_RECORD_APPLICANT_URL:-http://gateway-service:8080/api/v1/applicant}
      CREDENTIAL_URL: ${UNIVERSITY_RECORD_CREDENTIAL_URL:-http://gateway-service:8080/api/v1/credential}
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      Dev__EnableTestEndpoints: ${UNIVERSITY_RECORD_ENABLE_DEV_ENDPOINTS:-true}
    ports:
      - "8084:8080"
    networks:
      - student-id-net

  moderation-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MODERATION_POSTGRES_USER:-moderation_user}
      POSTGRES_PASSWORD: ${MODERATION_POSTGRES_PASSWORD:?set MODERATION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MODERATION_POSTGRES_DB:-moderation_db}
    volumes:
      - moderation_pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MODERATION_POSTGRES_USER:-moderation_user} -d ${MODERATION_POSTGRES_DB:-moderation_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  moderation-service:
    image: dmracovit/moderation-service:2.0.0
    restart: unless-stopped
    depends_on:
      moderation-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${MODERATION_POSTGRES_USER:-moderation_user}:${MODERATION_POSTGRES_PASSWORD:?set MODERATION_POSTGRES_PASSWORD}@moderation-postgres:5432/${MODERATION_POSTGRES_DB:-moderation_db}?sslmode=disable"
      # The stack's one X-Service-Token, sent on every call to a peer and on every event push.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      DEV_ENDPOINTS: ${MODERATION_DEV_ENDPOINTS:-true}
      SEED_ON_START: "true"
      REFERENCE_YEAR: *reference_year
      # Each peer is reached through the Gateway (README "Deployments"): the Gateway's address plus the
      # peer's prefix. The gateway-service block arrives with the Gateway image (#39); until then these
      # calls fail as DEPENDENCY_UNAVAILABLE and the relay keeps retrying, as the contract says.
      # Clearing a variable in .env (MODERATION_SESSION_URL=) selects the built-in mock of that peer.
      SESSION_URL: ${MODERATION_SESSION_URL-http://gateway-service:8080/api/v1/session}
      APPLICANT_URL: ${MODERATION_APPLICANT_URL-http://gateway-service:8080/api/v1/applicant}
      CREDENTIAL_URL: ${MODERATION_CREDENTIAL_URL-http://gateway-service:8080/api/v1/credential}
      UNIVERSITY_RECORD_URL: ${MODERATION_UNIVERSITY_RECORD_URL-http://gateway-service:8080/api/v1/university-record}
      RULES_URL: ${MODERATION_RULES_URL-http://gateway-service:8080/api/v1/server-rules}
    ports:
      - "8085:8085"
    networks:
      - student-id-net

  dms-mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DMS_MONGO_USER:-dms_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DMS_MONGO_PASSWORD:?set DMS_MONGO_PASSWORD}
    volumes:
      - dms_mongodata:/data/db
    ports:
      - "27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  dms-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - student-id-net

  discord-dms-service:
    image: dmracovit/discord-dms-service:2.0.0
    restart: unless-stopped
    depends_on:
      dms-mongo:
        condition: service_healthy
      dms-redis:
        condition: service_healthy
    environment:
      MONGODB_URI: "mongodb://${DMS_MONGO_USER:-dms_user}:${DMS_MONGO_PASSWORD:?set DMS_MONGO_PASSWORD}@dms-mongo:27017/dms_db?authSource=admin"
      REDIS_URL: redis://dms-redis:6379/0
      DEV_ENDPOINTS: ${DMS_DEV_ENDPOINTS:-true}
      SEED_ON_START: "true"
      # The address clients reach port 8086 at: the base of the ws_url a ticket comes with. The chat is
      # negotiated through the Gateway (POST /api/v1/discord-dms/ws-tickets) and connected here directly.
      WS_PUBLIC_URL: ${DMS_WS_PUBLIC_URL:-ws://localhost:8086}
    ports:
      - "8086:8086"   # stays published in the final stack: the direct WebSocket connection
    networks:
      - student-id-net

  player-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-player_user}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:?set PLAYER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-player_db}
    volumes:
      - player_pgdata:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_POSTGRES_USER:-player_user} -d ${PLAYER_POSTGRES_DB:-player_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  player-service:
    image: dimapos/player-service:0.1.0
    restart: unless-stopped
    depends_on:
      player-postgres:
        condition: service_healthy
    environment:
      APP_ENV: docker
      POSTGRES_HOST: player-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-player_user}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:?set PLAYER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-player_db}
      # Seeds six players on an empty database, including the one the README's
      # own example response describes (level 4, 1250 xp).
      SEED_ON_START: ${PLAYER_SEED_ON_START:-true}
      # Mounts POST /api/v1/dev/events/session-ended, the only way to deliver a
      # session.ended event until POST /api/v1/events exists. It grants
      # XP without a credential, so turn it off outside the demo.
      ENABLE_DEV_ENDPOINTS: ${PLAYER_ENABLE_DEV_ENDPOINTS:-true}
    ports:
      - "8087:8080"
    networks:
      - student-id-net

  session-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SESSION_POSTGRES_USER:-session_user}
      POSTGRES_PASSWORD: ${SESSION_POSTGRES_PASSWORD:?set SESSION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SESSION_POSTGRES_DB:-session_db}
    volumes:
      - session_pgdata:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SESSION_POSTGRES_USER:-session_user} -d ${SESSION_POSTGRES_DB:-session_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  session-service:
    image: dimapos/server-moderation-session-service:0.1.0
    restart: unless-stopped
    depends_on:
      session-postgres:
        condition: service_healthy
    environment:
      APP_ENV: docker
      POSTGRES_HOST: session-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${SESSION_POSTGRES_USER:-session_user}
      POSTGRES_PASSWORD: ${SESSION_POSTGRES_PASSWORD:?set SESSION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SESSION_POSTGRES_DB:-session_db}
      # Wired to the three services in this file that it calls. An empty url
      # selects a built-in stub instead; GET /health/ready says which are real.
      PLAYER_SERVICE_URL: http://player-service:8080
      RULES_SERVICE_URL: http://server-rules-service:8080
      APPLICANT_SERVICE_URL: http://applicant-service:8081
      # Seeds three sessions on an empty database - one in each state - so every
      # endpoint answers on the first request.
      SEED_ON_START: ${SESSION_SEED_ON_START:-true}
      # Mounts POST /api/v1/dev/events/decision-recorded, the only way to deliver
      # a decision.recorded event until POST /api/v1/events exists. It moves a
      # session's score with no credential, so turn it off outside the demo.
      ENABLE_DEV_ENDPOINTS: ${SESSION_ENABLE_DEV_ENDPOINTS:-true}
    ports:
      - "8088:8080"
    networks:
      - student-id-net

  applicant-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APPLICANT_POSTGRES_USER:-applicant_user}
      POSTGRES_PASSWORD: ${APPLICANT_POSTGRES_PASSWORD:?set APPLICANT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APPLICANT_POSTGRES_DB:-applicant_db}
    volumes:
      - applicant_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APPLICANT_POSTGRES_USER:-applicant_user} -d ${APPLICANT_POSTGRES_DB:-applicant_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  applicant-service:
    image: stewdh/applicant-service:2.1.0
    restart: unless-stopped
    depends_on:
      applicant-postgres:
        condition: service_healthy
    environment:
      APP_ENV: docker
      APP_PORT: "8081"
      LOG_LEVEL: info
      SERVICE_VERSION: "2.1.0"
      TZ: UTC
      # Task timeout (408) and concurrent task limit (429) - README "Task timeout and concurrent
      # task limit". DEV_ENDPOINTS mounts GET /api/v1/dev/slow?ms=, which demonstrates both.
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      DEV_ENDPOINTS: ${APPLICANT_DEV_ENDPOINTS:-true}
      DATABASE_URL: "postgres://${APPLICANT_POSTGRES_USER:-applicant_user}:${APPLICANT_POSTGRES_PASSWORD:?set APPLICANT_POSTGRES_PASSWORD}@applicant-postgres:5432/${APPLICANT_POSTGRES_DB:-applicant_db}?sslmode=disable"
      MIGRATE_ON_START: "true"
      # Event delivery (README "Event delivery"): applicant.initialized is pushed from the
      # outbox to each consumer's POST /api/v1/events through the Gateway, with the one
      # service token. Through the Gateway, never a peer's own address.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      CREDENTIAL_URL: http://gateway-service:8080/api/v1/credential
      UNIVERSITY_RECORD_URL: http://gateway-service:8080/api/v1/university-record
      REFERENCE_YEAR: *reference_year
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "/applicantd", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - student-id-net

  credential-mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CREDENTIAL_MONGO_USER:-credential_user}
      MONGO_INITDB_ROOT_PASSWORD: ${CREDENTIAL_MONGO_PASSWORD:?set CREDENTIAL_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: credential_db
    volumes:
      - credential_mongodata:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - student-id-net

  credential-service:
    image: stewdh/credential-service:2.1.0
    restart: unless-stopped
    depends_on:
      credential-mongo:
        condition: service_healthy
    environment:
      APP_ENV: docker
      APP_PORT: "8082"
      LOG_LEVEL: info
      SERVICE_VERSION: "2.1.0"
      TZ: UTC
      HTTP_REQUEST_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "64"
      DEV_ENDPOINTS: ${CREDENTIAL_DEV_ENDPOINTS:-true}
      MONGODB_URI: "mongodb://${CREDENTIAL_MONGO_USER:-credential_user}:${CREDENTIAL_MONGO_PASSWORD:?set CREDENTIAL_MONGO_PASSWORD}@credential-mongo:27017/credential_db?authSource=admin"
      MONGODB_DATABASE: credential_db
      ENSURE_INDEXES_ON_START: "true"
      # Event delivery, as for Applicant above.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}
      APPLICANT_URL: http://gateway-service:8080/api/v1/applicant
      UNIVERSITY_RECORD_URL: http://gateway-service:8080/api/v1/university-record
      REFERENCE_YEAR: *reference_year
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "/credentiald", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - student-id-net

networks:
  student-id-net:
    external: true
    name: student-id-net

volumes:
  rules_pgdata:
  university_record_pgdata:
  moderation_pgdata:
  dms_mongodata:
  player_pgdata:
  session_pgdata:
  applicant_pgdata:
  credential_mongodata:
