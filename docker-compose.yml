# Team-wide compose - references PUBLISHED Docker Hub images only, never `build:`. Any
# teammate can run this without cloning anyone's (private) service repository. It covers
# the Gateway, all 8 services, Service Discovery, the Message Broker, the monitoring (Lab 4, #113):
# Prometheus, Loki, Alloy and Grafana, and from Lab 5 the data warehouse with the ETL Service (#165), the Gateway's
# cache nodes (#170) and the replicated databases (#164). Clients reach the system through the Gateway; from Lab 4
# every request and
# event between the components travels through the Message Broker (README "Message Broker", "Event delivery").
# New blocks follow the same pattern, referencing a published image and joining the same
# `student-id-net` network.
#
# Every service token below is the same value, SERVICE_TOKEN in .env - the contract's one
# X-Service-Token for the whole stack.
#
# Host ports are allocated in the Deployments table of README.md - check it and take the
# next free number before adding a block, so two services never claim the same port.
#
# Usage:
#   docker network create student-id-net   # once, if it does not already exist
#   docker compose up -d
name: student-id-please

x-reference-year: &reference_year "2026"

# Moderation's replicated PostgreSQL (#164, #177): the environment and the node template its three nodes share.
x-moderation-pg-env: &moderation_pg_env
  POSTGRES_USER: ${MODERATION_POSTGRES_USER:-moderation_user}
  POSTGRES_PASSWORD: ${MODERATION_POSTGRES_PASSWORD:?set MODERATION_POSTGRES_PASSWORD}
  POSTGRES_DB: ${MODERATION_POSTGRES_DB:-moderation_db}
  PGHA_CLUSTER: moderation-postgres
  PGHA_NODES: "moderation-postgres-1 moderation-postgres-2 moderation-postgres-3"
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD}
  FAILOVER_PASSWORD: ${FAILOVER_PASSWORD:?set FAILOVER_PASSWORD}
  ETL_READER_PASSWORD: ${ETL_READER_PASSWORD:?set ETL_READER_PASSWORD}

x-moderation-pg-node: &moderation_pg_node
  image: postgres:17-alpine
  restart: unless-stopped
  entrypoint: ["bash", "/ha/node.sh"]
  stop_grace_period: 30s
  healthcheck:              # healthy as a primary and as a standby; the output (docker inspect) names the role
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -XAtc \"select case when pg_is_in_recovery() then 'standby' else 'primary' end\""]
    interval: 5s
    timeout: 5s
    retries: 20
  networks:
    - student-id-net

# The members of Discord DMs' replica set (#164, #178): the template the three share.
x-dms-mongo-member: &dms_mongo_member
  image: mongo:7
  restart: unless-stopped
  entrypoint: ["bash", "/rs/node.sh"]
  # mongod spends up to 15 s in quiesce mode on SIGTERM; Docker's default 10 s would end it with a SIGKILL.
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20
  networks:
    - student-id-net

# The Gateway's cache nodes (Lab 5, #170): the template the three identical nodes share.
x-cache-node: &cache_node
  image: valkey/valkey:8-alpine
  restart: unless-stopped
  command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  healthcheck:
    test: ["CMD", "valkey-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10
  networks:
    - student-id-net

